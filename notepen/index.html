<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<link rel="manifest" href="manifest.json">
<title>ELOHIM 777 NOTEPEN</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0a12; --void-2:#12121d; --panel:#15151f;
    --lapis:#2f4c8a; --lapis-bright:#5b7fd6;
    --sun-gold:#e8a33d; --sun-clay:#c9622b; --rune-cyan:#7dd3e0;
    --parchment:#eae4d6; --parchment-dim:#8f8a7c;
    --line:rgba(234,228,214,0.1);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 12% -10%, rgba(47,76,138,0.35), transparent 60%),
      radial-gradient(ellipse 700px 480px at 100% 110%, rgba(201,98,43,0.16), transparent 60%),
      var(--void);
    color:var(--parchment);
    font-family:'Space Grotesk', sans-serif;
    height:100dvh; display:flex; flex-direction:column; overflow:hidden;
  }
  button,input,textarea{font-family:inherit; color:inherit;}
  button{cursor:pointer;}
  header{
    display:flex; align-items:center; gap:10px;
    padding:12px 16px 8px; flex-shrink:0;
  }
  .back{
    background:transparent; border:1px solid var(--sun-gold); color:var(--sun-gold);
    border-radius:3px; padding:7px 10px; font-size:13px; font-weight:600; flex-shrink:0;
  }
  .back[hidden]{display:none;}
  .glyph{width:28px; height:28px; flex-shrink:0;}
  h1{
    font-family:'Cinzel', serif; font-weight:700; font-size:16px; letter-spacing:0.14em;
    background:linear-gradient(90deg, var(--sun-gold), var(--rune-cyan) 140%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--parchment-dim); margin-top:2px;}
  .search-wrap{position:relative; padding:0 16px 8px; flex-shrink:0;}
  .search-wrap input{
    width:100%; background:var(--void-2); border:1px solid var(--line); color:var(--parchment);
    font-size:16px; padding:11px 40px 11px 12px; border-radius:4px; outline:none;
  }
  .search-wrap input:focus{border-color:var(--lapis-bright);}
  .star{
    position:absolute; right:24px; top:8px; background:none; border:none;
    color:var(--parchment-dim); font-size:18px; padding:4px 6px;
  }
  .star.on{color:var(--sun-gold);}
  #suggest{
    position:absolute; left:16px; right:16px; top:48px; z-index:20;
    background:#12121df2; border:1px solid var(--line); border-radius:4px;
    max-height:240px; overflow:auto; box-shadow:0 16px 40px rgba(0,0,0,0.45);
  }
  #suggest[hidden]{display:none;}
  .sug{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:9px 12px; font-size:15px; border-bottom:1px solid var(--line);
  }
  .sug mark{background:none; color:var(--sun-gold);}
  .sug.on,.sug:hover{background:rgba(91,127,214,0.18);}
  .favs{display:flex; gap:6px; overflow:auto; padding:0 16px 8px; flex-shrink:0;}
  .favs:empty{display:none;}
  .chip{
    background:var(--void-2); border:1px solid var(--line); color:var(--rune-cyan);
    border-radius:99px; padding:4px 10px; font-size:12px; white-space:nowrap;
  }
  .chip:hover{border-color:var(--sun-gold); color:var(--sun-gold);}
  main{flex:1; min-height:0; display:flex; flex-direction:column;}
  .tabs{
    display:flex; gap:0; border-bottom:1px solid var(--line); flex-shrink:0;
    background:rgba(10,10,18,0.72); overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  .tab{
    flex:0 0 auto; background:none; border:none; color:var(--parchment-dim);
    padding:12px 14px; font-size:12px; font-weight:600; letter-spacing:0.06em;
    text-transform:uppercase; border-bottom:2px solid transparent; white-space:nowrap;
  }
  .tab.on{color:var(--sun-gold); border-bottom-color:var(--sun-gold);}
  .panel{display:none; flex-direction:column; min-height:0; flex:1;}
  .panel.on{display:flex;}
  .tools{display:none; flex-direction:column; min-height:0; flex:1;}
  .tools.on{display:flex;}
  .scroll{flex:1; overflow:auto; padding:14px 16px 24px;}
  textarea{
    flex:1; width:100%; resize:none; border:none; outline:none; background:transparent;
    font-size:17px; line-height:1.55; padding:14px 16px; min-height:0;
  }
  .pad-bar{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 14px 12px; border-top:1px solid var(--line); color:var(--parchment-dim); font-size:12px;
  }
  .ghost{
    background:transparent; border:1px solid var(--lapis-bright); color:var(--rune-cyan);
    border-radius:3px; padding:7px 12px; font-size:12px; font-weight:600;
  }
  .ghost:hover{background:rgba(91,127,214,0.15);}
  .headword{
    font-family:'Cinzel', serif; font-size:28px; letter-spacing:0.04em; color:var(--parchment);
  }
  .pos{color:var(--sun-gold); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; margin:6px 0 10px;}
  .def{font-size:16px; line-height:1.5; max-width:62ch;}
  .muted{color:var(--parchment-dim); font-size:14px; line-height:1.45;}
  .group{margin:0 0 16px;}
  .group h3{
    font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--parchment-dim);
    margin:0 0 8px;
  }
  .cloud{display:flex; flex-wrap:wrap; gap:8px;}
  .word{
    background:var(--void-2); border:1px solid var(--line); color:var(--parchment);
    border-radius:3px; padding:7px 10px; font-size:14px;
  }
  .word:hover{border-color:var(--sun-gold); color:var(--sun-gold);}
  .speak{margin-left:8px; vertical-align:middle;}
  .ref{margin-top:18px; padding-top:14px; border-top:1px solid var(--line);}
  .ref-name{font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--sun-gold); margin-bottom:8px;}
  a.link{display:inline-block; margin-top:10px; text-decoration:none;}
  .modes{display:flex; gap:8px; margin-bottom:16px;}
  .mode{
    background:var(--void-2); border:1px solid var(--line); color:var(--parchment-dim);
    border-radius:99px; padding:7px 12px; font-size:13px; font-weight:600;
  }
  .mode.on{color:var(--void); background:var(--sun-gold); border-color:var(--sun-gold);}
  .gem-total{font-family:'Cinzel',serif; font-size:42px; color:var(--sun-gold); margin:8px 0 14px;}
  .gem-row{display:flex; justify-content:space-between; max-width:220px; padding:6px 0; border-bottom:1px solid var(--line); font-size:15px;}
  @media (min-width:980px){
    main{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(340px,0.85fr);}
    #panel-pad{display:flex; border-right:1px solid var(--line);}
    .tools{display:flex;}
  }
  @media (max-width:979px){
    body{height:100dvh;}
    #panel-pad.on{flex:1;}
  }
</style>
</head>
<body>
<header>
  <button class="back" id="back" type="button" hidden>Back</button>
  <svg class="glyph" viewBox="0 0 40 40" fill="none" aria-hidden="true">
    <circle cx="14" cy="20" r="10" stroke="#e8a33d" stroke-width="1.4"/>
    <circle cx="26" cy="20" r="10" stroke="#7dd3e0" stroke-width="1.4"/>
  </svg>
  <div>
    <h1>ELOHIM 777</h1>
    <div class="sub">Notepen</div>
  </div>
  <button class="ghost" id="installApp" type="button" hidden style="margin-left:auto">Install</button>
</header>
<div class="search-wrap">
  <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a word" enterkeyhint="search">
  <button class="star" id="star" type="button" title="Favorite" hidden>☆</button>
  <div id="suggest" hidden></div>
</div>
<div class="favs" id="favs"></div>
<nav class="tabs" id="tabs">
  <button class="tab on" data-panel="pad" type="button">Notepad</button>
  <button class="tab" data-panel="dict" type="button">Dictionary</button>
  <button class="tab" data-panel="thes" type="button">Thesaurus</button>
  <button class="tab" data-panel="rhyme" type="button">Rhymer</button>
  <button class="tab" data-panel="refs" type="button">References</button>
  <button class="tab" data-panel="gem" type="button">Gematria</button>
</nav>
<main>
  <section class="panel on" id="panel-pad">
    <textarea id="pad" placeholder="Write here. There is no word limit. Select a word to look it up, then use the tabs or Back."></textarea>
    <div class="pad-bar">
      <span id="counts">0 words · no word limit</span>
      <button class="ghost" id="read" type="button">Read aloud</button>
    </div>
  </section>
  <section class="tools" id="tools">
    <section class="panel" id="panel-dict"><div class="scroll" id="dict"></div></section>
    <section class="panel" id="panel-thes"><div class="scroll" id="thes"></div></section>
    <section class="panel" id="panel-rhyme"><div class="scroll" id="rhyme"></div></section>
    <section class="panel" id="panel-refs"><div class="scroll" id="refs"></div></section>
    <section class="panel" id="panel-gem"><div class="scroll" id="gem"></div></section>
  </section>
</main>
<script src="lexicon.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var LEX = window.LEX;
  var q = $('q'), suggest = $('suggest'), pad = $('pad'), star = $('star');
  var panel = 'dict';
  var current = '';
  var favs = [];
  var sugIndex = -1;
  var rhymeMap = null;
  var saveTimer = 0;
  function db(){
    if(db.promise) return db.promise;
    db.promise = new Promise(function(resolve, reject){
      if(!window.indexedDB){ reject(new Error('no')); return; }
      var req = indexedDB.open('elohim-notepen', 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore('kv'); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
    return db.promise;
  }
  function idbSet(key, val){
    return db().then(function(d){
      return new Promise(function(resolve){
        var tx = d.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(val, key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ resolve(); };
      });
    }).catch(function(){});
  }
  function idbGet(key){
    return db().then(function(d){
      return new Promise(function(resolve){
        var rq = d.transaction('kv').objectStore('kv').get(key);
        rq.onsuccess = function(){ resolve(rq.result); };
        rq.onerror = function(){ resolve(undefined); };
      });
    }).catch(function(){ return undefined; });
  }

  function wide(){ return window.innerWidth >= 980; }

  function showPanel(name){
    panel = name || 'pad';
    var tabs = document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on', tabs[i].getAttribute('data-panel') === panel);
    var ids = ['pad','dict','thes','rhyme','refs','gem'];
    for(var j=0;j<ids.length;j++){
      var el = $('panel-' + ids[j]);
      if(!el) continue;
      var on = ids[j] === panel || (wide() && ids[j] === 'pad');
      el.classList.toggle('on', on);
    }
    $('tools').classList.toggle('on', wide() || panel !== 'pad');
    $('back').hidden = panel === 'pad';
    try{ localStorage.setItem('notepen-panel', panel); }catch(e){}
    if(panel === 'refs') loadRefs();
    if(panel === 'gem') renderGem();
  }

  function lowerBound(prefix){
    var lo = 0, hi = LEX.w.length;
    while(lo < hi){
      var mid = (lo + hi) >> 1;
      if(LEX.w[mid] < prefix) lo = mid + 1; else hi = mid;
    }
    return lo;
  }
  function findExact(word){
    var i = lowerBound(word);
    return (i < LEX.w.length && LEX.w[i] === word) ? i : -1;
  }
  function suggestions(prefix){
    var out = [];
    if(!prefix) return out;
    var i = lowerBound(prefix);
    while(i < LEX.w.length && LEX.w[i].indexOf(prefix) === 0 && out.length < 12){
      out.push(LEX.w[i]);
      i++;
    }
    return out;
  }
  function hideSuggest(){ suggest.hidden = true; suggest.innerHTML = ''; sugIndex = -1; }
  function paintSuggest(){
    var prefix = q.value.trim().toLowerCase();
    var list = suggestions(prefix);
    if(!prefix || !list.length){ hideSuggest(); return; }
    suggest.innerHTML = '';
    for(var i=0;i<list.length;i++){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'sug' + (i === sugIndex ? ' on' : '');
      b.setAttribute('data-word', list[i]);
      var pre = list[i].slice(0, prefix.length);
      var rest = list[i].slice(prefix.length);
      b.innerHTML = '<mark></mark><span></span>';
      b.querySelector('mark').textContent = pre;
      b.querySelector('span').textContent = rest;
      suggest.appendChild(b);
    }
    suggest.hidden = false;
  }

  function rhymeKey(phoneStr){
    var phones = phoneStr.split(' ');
    var idx = -1, i;
    for(i=0;i<phones.length;i++) if(/[12]$/.test(phones[i])) idx = i;
    if(idx < 0){
      for(i=0;i<phones.length;i++) if(/[0-2]$/.test(phones[i])) idx = i;
    }
    if(idx < 0) return '';
    return phones.slice(idx).join(' ');
  }
  function syllables(phoneStr){
    var m = phoneStr.match(/[012](?=\s|$)/g);
    return m && m.length ? m.length : 1;
  }
  function buildRhymes(){
    rhymeMap = new Map();
    for(var i=0;i<LEX.w.length;i++){
      if(!LEX.p[i]) continue;
      var alts = LEX.p[i].split('|');
      for(var a=0;a<alts.length;a++){
        var key = rhymeKey(alts[a]);
        if(!key) continue;
        var arr = rhymeMap.get(key);
        if(!arr){ arr = []; rhymeMap.set(key, arr); }
        arr.push({i:i, syl:syllables(alts[a])});
      }
    }
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function wordButton(word){
    return '<button class="word" type="button" data-word="'+esc(word)+'">'+esc(word)+'</button>';
  }
  function empty(el, text){ el.innerHTML = '<p class="muted">'+esc(text)+'</p>'; }

  function paintStar(){
    if(!current){ star.hidden = true; return; }
    star.hidden = false;
    var on = favs.indexOf(current) >= 0;
    star.classList.toggle('on', on);
    star.textContent = on ? '★' : '☆';
  }
  function renderFavs(){
    var box = $('favs');
    box.innerHTML = '';
    for(var i=0;i<favs.length && i<24;i++){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.setAttribute('data-word', favs[i]);
      b.textContent = favs[i];
      box.appendChild(b);
    }
  }

  function renderDict(){
    var el = $('dict');
    if(!current){ empty(el, 'Type in the search box. Matching words appear as you type.'); return; }
    var i = findExact(current);
    var def = LEX.d[current];
    var html = '<div class="headword">'+esc(current)+'</div>';
    html += '<button class="ghost speak" id="speakWord" type="button">Speak</button>';
    if(def){
      html += '<p class="def" style="margin-top:14px">'+esc(def)+'</p>';
    } else if(i >= 0){
      html += '<p class="muted" style="margin-top:14px">This word is in the rhyme list, but it has no dictionary entry.</p>';
    } else {
      html += '<p class="muted" style="margin-top:14px">No entry for that spelling. Pick a suggestion above.</p>';
    }
    el.innerHTML = html;
    var speak = $('speakWord');
    if(speak) speak.addEventListener('click', speakWord);
  }
  function renderThes(){
    var el = $('thes');
    if(!current){ empty(el, 'Synonyms show here after you choose a word.'); return; }
    var list = LEX.s[current] || [];
    var html = '<div class="headword">'+esc(current)+'</div>';
    if(!list.length){
      html += '<p class="muted" style="margin-top:14px">No synonyms stored for this word.</p>';
    } else {
      html += '<div class="cloud" style="margin-top:14px">';
      for(var i=0;i<list.length;i++) html += wordButton(list[i]);
      html += '</div>';
    }
    el.innerHTML = html;
  }
  function renderRhyme(){
    var el = $('rhyme');
    if(!current){ empty(el, 'Rhymes are grouped by syllable count, the way a rhyming dictionary is.'); return; }
    var i = findExact(current);
    var phones = i >= 0 ? LEX.p[i] : '';
    var html = '<div class="headword">'+esc(current)+'</div>';
    if(!phones){
      html += '<p class="muted" style="margin-top:14px">No pronunciation for this word, so it cannot be rhymed.</p>';
      el.innerHTML = html; return;
    }
    if(!rhymeMap) buildRhymes();
    var seen = {};
    var groups = {};
    var alts = phones.split('|');
    for(var a=0;a<alts.length;a++){
      var key = rhymeKey(alts[a]);
      var arr = key && rhymeMap.get(key);
      if(!arr) continue;
      for(var k=0;k<arr.length;k++){
        var w = LEX.w[arr[k].i];
        if(w === current || seen[w]) continue;
        seen[w] = 1;
        var syl = arr[k].syl;
        if(!groups[syl]) groups[syl] = [];
        if(groups[syl].length < 48) groups[syl].push(w);
      }
    }
    var keys = Object.keys(groups).map(Number).sort(function(a,b){ return a-b; });
    if(!keys.length){
      html += '<p class="muted" style="margin-top:14px">No other words share that ending.</p>';
      el.innerHTML = html; return;
    }
    for(var g=0;g<keys.length;g++){
      var n = keys[g];
      var label = n + (n === 1 ? ' syllable' : ' syllables');
      groups[n].sort();
      html += '<div class="group"><h3>'+label+'</h3><div class="cloud">';
      for(var t=0;t<groups[n].length;t++) html += wordButton(groups[n][t]);
      html += '</div></div>';
    }
    el.innerHTML = html;
  }

  var refToken = 0;
  var gemMode = 'simple';
  try{ gemMode = localStorage.getItem('notepen-gem') || 'simple'; }catch(e){}
  var HEB_LATIN = {a:1,b:2,c:3,d:4,e:5,f:6,g:7,h:8,i:9,j:10,k:20,l:30,m:40,n:50,o:60,p:70,q:100,r:200,s:300,t:400,u:6,v:6,w:6,x:60,y:10,z:7};
  var HEB = {'\u05d0':1,'\u05d1':2,'\u05d2':3,'\u05d3':4,'\u05d4':5,'\u05d5':6,'\u05d6':7,'\u05d7':8,'\u05d8':9,'\u05d9':10,'\u05db':20,'\u05da':20,'\u05dc':30,'\u05de':40,'\u05dd':40,'\u05e0':50,'\u05df':50,'\u05e1':60,'\u05e2':70,'\u05e4':80,'\u05e3':80,'\u05e6':90,'\u05e5':90,'\u05e7':100,'\u05e8':200,'\u05e9':300,'\u05ea':400};

  function wikiTitle(word){
    return String(word).split(/[\s\-]+/).map(function(p){
      return p ? p.charAt(0).toUpperCase() + p.slice(1) : '';
    }).join('_');
  }
  function remote(url){
    if(window.Notepen && window.Notepen.fetch){
      return Promise.resolve(window.Notepen.fetch(url)).then(function(body){
        if(!body) throw new Error('empty');
        return body;
      });
    }
    return fetch(url).then(function(r){
      if(!r.ok) throw new Error('status');
      return r.text();
    });
  }
  function decodeEntities(s){
    var t = document.createElement('textarea');
    t.innerHTML = s;
    return t.value;
  }
  function loadRefs(){
    var word = current;
    var box = $('refs');
    if(!word){ empty(box, 'Look up a word. Wikipedia and Grokipedia show a short line and a link.'); return; }
    var title = wikiTitle(word);
    var wikiUrl = 'https://en.wikipedia.org/wiki/' + encodeURIComponent(title);
    var grokUrl = 'https://grokipedia.com/page/' + encodeURIComponent(title);
    box.innerHTML = '<div class="headword">'+esc(word)+'</div>'
      + '<div class="ref"><div class="ref-name">Wikipedia</div><p class="def" id="wikiText">Loading a short definition…</p><a class="ghost link" id="wikiLink" href="'+esc(wikiUrl)+'" target="_blank" rel="noopener">Open Wikipedia</a></div>'
      + '<div class="ref"><div class="ref-name">Grokipedia</div><p class="def" id="grokText">Loading a short definition…</p><a class="ghost link" id="grokLink" href="'+esc(grokUrl)+'" target="_blank" rel="noopener">Open Grokipedia</a></div>';
    var token = ++refToken;
    remote('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title)).then(function(text){
      if(token !== refToken) return;
      var data = JSON.parse(text);
      var el = $('wikiText');
      if(el) el.textContent = data.extract || 'No short definition. The article link is below.';
      if(data.content_urls && data.content_urls.desktop && data.content_urls.desktop.page && $('wikiLink')){
        $('wikiLink').href = data.content_urls.desktop.page;
      }
    }).catch(function(){
      if(token !== refToken) return;
      if($('wikiText')) $('wikiText').textContent = 'Could not load the short definition. The article link still opens.';
    });
    remote(grokUrl).then(function(html){
      if(token !== refToken) return;
      var m = /name="description" content="([^"]*)"/.exec(html);
      if($('grokText')) $('grokText').textContent = m ? decodeEntities(m[1]) : 'No short line on that page. The article link still opens.';
    }).catch(function(){
      if(token !== refToken) return;
      if($('grokText')) $('grokText').textContent = 'Open the article for the full Grokipedia page. This browser cannot read the short line directly.';
    });
  }
  function gemValue(ch, mode){
    if(mode === 'hebrew'){
      if(HEB[ch] != null) return HEB[ch];
      var low = ch.toLowerCase();
      if(HEB_LATIN[low] != null) return HEB_LATIN[low];
      return null;
    }
    var low = ch.toLowerCase();
    if(low < 'a' || low > 'z') return null;
    var n = low.charCodeAt(0) - 96;
    return mode === 'english' ? n * 6 : n;
  }
  function renderGem(){
    var el = $('gem');
    var text = current || '';
    var html = '<div class="modes" id="gemModes">'
      + '<button type="button" class="mode'+(gemMode==='simple'?' on':'')+'" data-gem="simple">Simple</button>'
      + '<button type="button" class="mode'+(gemMode==='english'?' on':'')+'" data-gem="english">English</button>'
      + '<button type="button" class="mode'+(gemMode==='hebrew'?' on':'')+'" data-gem="hebrew">Hebrew</button>'
      + '</div>';
    if(!text){
      html += '<p class="muted">Type a word. Simple is A=1 through Z=26. English multiplies that by 6. Hebrew uses the classic letter values.</p>';
      el.innerHTML = html;
      return;
    }
    var total = 0, rows = '', i;
    for(i=0;i<text.length;i++){
      var v = gemValue(text.charAt(i), gemMode);
      if(v == null) continue;
      total += v;
      rows += '<div class="gem-row"><span>'+esc(text.charAt(i).toUpperCase())+'</span><span>'+v+'</span></div>';
    }
    html += '<div class="headword">'+esc(text)+'</div><div class="gem-total">'+total+'</div><div>'+rows+'</div>';
    el.innerHTML = html;
  }

  function lookup(word, reveal){
    word = String(word || '').toLowerCase().trim();
    if(!word) return;
    current = word;
    q.value = word;
    hideSuggest();
    paintStar();
    renderDict();
    renderThes();
    renderRhyme();
    renderGem();
    if(panel === 'refs') loadRefs();
    try{ localStorage.setItem('notepen-word', word); }catch(e){}
    if(reveal && panel === 'pad') showPanel('dict');
  }
  function speakWord(){
    if(!current || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(current));
  }

  function counts(){
    var t = pad.value;
    var words = (t.match(/[A-Za-z0-9']+/g) || []).length;
    $('counts').textContent = words + (words === 1 ? ' word' : ' words') + ' · no word limit';
  }

  if(!LEX || !LEX.w){
    $('dict').innerHTML = '<p class="muted">The word lists did not load.</p>';
    return;
  }

  try{ favs = JSON.parse(localStorage.getItem('notepen-favs') || '[]'); }catch(e){ favs = []; }
  if(!Array.isArray(favs)) favs = [];
  try{ pad.value = localStorage.getItem('notepen-text') || ''; }catch(e){}
  counts();
  renderFavs();
  showPanel('pad');
  try{
    var last = localStorage.getItem('notepen-word');
    if(last) lookup(last, false);
    else { renderDict(); renderThes(); renderRhyme(); renderGem(); }
  }catch(e){}
  idbGet('note').then(function(saved){
    if(typeof saved === 'string' && saved.length >= pad.value.length){
      pad.value = saved;
      counts();
    }
  });

  q.addEventListener('input', function(){ sugIndex = -1; paintSuggest(); });
  q.addEventListener('focus', paintSuggest);
  q.addEventListener('keydown', function(e){
    var items = suggest.querySelectorAll('.sug');
    if(e.key === 'ArrowDown' && items.length){
      e.preventDefault();
      sugIndex = Math.min(items.length - 1, sugIndex + 1);
      paintSuggest();
    } else if(e.key === 'ArrowUp' && items.length){
      e.preventDefault();
      sugIndex = Math.max(0, sugIndex - 1);
      paintSuggest();
    } else if(e.key === 'Enter'){
      e.preventDefault();
      var picked = sugIndex >= 0 && items[sugIndex] ? items[sugIndex].getAttribute('data-word') : '';
      var typed = q.value.trim().toLowerCase();
      lookup(picked || (findExact(typed) >= 0 ? typed : (suggestions(typed)[0] || typed)), true);
    } else if(e.key === 'Escape'){
      hideSuggest();
    }
  });
  document.addEventListener('click', function(e){
    var node = e.target.closest ? e.target.closest('[data-word]') : null;
    var word = node ? node.getAttribute('data-word') : '';
    if(word){ lookup(word, node.classList.contains('sug') || node.classList.contains('word')); return; }
    if(e.target !== q && !suggest.contains(e.target)) hideSuggest();
  });
  star.addEventListener('click', function(){
    if(!current) return;
    var i = favs.indexOf(current);
    if(i >= 0) favs.splice(i, 1); else favs.unshift(current);
    try{ localStorage.setItem('notepen-favs', JSON.stringify(favs)); }catch(e){}
    paintStar();
    renderFavs();
  });
  $('tabs').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.tab') : null;
    if(!b) return;
    showPanel(b.getAttribute('data-panel'));
  });
  pad.addEventListener('input', function(){
    counts();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      var text = pad.value;
      try{ localStorage.setItem('notepen-text', text); }catch(e){}
      idbSet('note', text);
    }, 300);
  });
  pad.addEventListener('pointerup', function(){
    var text = pad.value.slice(pad.selectionStart, pad.selectionEnd).trim();
    if(/^[A-Za-z][A-Za-z'\-]{1,28}$/.test(text)) lookup(text.toLowerCase(), false);
  });
  $('read').addEventListener('click', function(){
    var text = pad.value.trim();
    if(!text || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95;
    speechSynthesis.speak(u);
  });
  window.addEventListener('resize', function(){ showPanel(panel); });
  $('back').addEventListener('click', function(){ showPanel('pad'); pad.focus(); });
  $('gem').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-gem]') : null;
    if(!b) return;
    gemMode = b.getAttribute('data-gem');
    try{ localStorage.setItem('notepen-gem', gemMode); }catch(err){}
    renderGem();
  });

  window.notepenBack = function(){
    if(panel !== 'pad'){ showPanel('pad'); return true; }
    return false;
  };
  if(location.protocol === 'http:' || location.protocol === 'https:'){
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js', {scope: './'}).catch(function(){});
    }
    var installBtn = $('installApp');
    var deferred = null;
    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferred = e;
      installBtn.hidden = false;
    });
    installBtn.addEventListener('click', function(){
      if(!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function(){ deferred = null; installBtn.hidden = true; });
    });
    window.addEventListener('appinstalled', function(){ installBtn.hidden = true; });
  }
})();
</script>
</body>
</html>
